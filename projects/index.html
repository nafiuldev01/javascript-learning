<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Nafiul Siam</h1>
    <button>Stop</button>

    <script>
      const changeText = function () {
        document.querySelector("h1").innerHTML = "Sanjana Haque Sanju";
      };

      const changeName = setTimeout(changeText, 2000);

      // clearTimeout(changeName); // it removes all the functions from que stack

      document.querySelector("button").addEventListener("click", function () {
        clearTimeout(changeName);
        console.log("Stopped");
      });
    </script>
  </body>
</html>
