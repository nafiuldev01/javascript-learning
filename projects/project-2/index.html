<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="bmiStyle.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="title">BMI | CALCULATOR</h2>
      <form>
        <div class="inputs">
          <label>Height in Centimeter:</label>
          <input type="text" id="height" />
        </div>
        <div class="inputs">
          <label>Weight in Kilograms:</label>
          <input type="text" id="weight" />
        </div>
        <button>calculate</button>
        <div class="results"></div>
      </form>
      <h2>BMI - Weigh guide.</h2>
      <p>Underweight: Below 18.5</p>
      <p>Healthy weight: 18.5 to 24.9</p>
      <p>Overweight: 25.0 to 29.9</p>
      <p>Obesity: 30.0 and above</p>
    </div>

    <script src="index.js"></script>
  </body>
</html>
